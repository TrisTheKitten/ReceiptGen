<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReceiptGEN - 7/11 & Lazada Receipt Generator</title>
    <meta name="description" content="Generate realistic 7-Eleven and Lazada receipts with customizable details and export options." />
    <meta property="og:title" content="ReceiptGEN - 7/11 & Lazada Receipt Generator" />
    <meta property="og:description" content="Generate realistic 7-Eleven and Lazada receipts with customizable details and export options." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/avatar.svg" />
    <link rel="icon" type="image/svg+xml" href="/avatar.svg" />
    <meta name="theme-color" content="#f8fafc" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      .font-thai {
        font-family: 'Sarabun', sans-serif;
      }
      .font-mono-receipt {
        font-family: 'Courier Prime', monospace;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent; 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      
      .scanner-wrapper {
        --scan-rotation: 0deg;
        --scan-perspective-x: 0deg;
        --scan-perspective-y: 0deg;
        --scan-noise: 0.15;
        --scan-vignette: 0.4;
        --scan-warmth: 0.05;
        --scan-brightness: 0.96;
        --scan-contrast: 1.1;
        --scan-blur: 0.3px;
        --scan-shadow: 0.2;
        --scan-texture: 0.12;
        perspective: 1200px;
        display: inline-block;
      }

      .scan-background {
        padding: 40px;
        border-radius: 4px;
      }

      .scan-bg-none {
        background: transparent;
        padding: 0;
      }

      .scan-bg-dark-floor {
        background: 
          linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.2) 100%),
          radial-gradient(ellipse at 50% 100%, rgba(60,60,60,0.4) 0%, transparent 60%),
          linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 25%, #252525 50%, #1e1e1e 75%, #222222 100%);
        box-shadow: 
          inset 0 0 100px rgba(0,0,0,0.3),
          inset 0 2px 4px rgba(255,255,255,0.02);
      }
      
      .scan-bg-dark-floor::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.4;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='floorNoise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23floorNoise)'/%3E%3C/svg%3E");
        pointer-events: none;
        border-radius: 4px;
      }

      .scan-bg-wood {
        background: 
          repeating-linear-gradient(
            90deg,
            transparent 0px,
            rgba(139,90,43,0.03) 2px,
            transparent 4px
          ),
          linear-gradient(180deg, rgba(0,0,0,0.1) 0%, transparent 50%, rgba(0,0,0,0.15) 100%),
          linear-gradient(90deg, #5d4037 0%, #6d4c3d 20%, #5a3d2e 40%, #654433 60%, #5d4037 80%, #6d4c3d 100%);
        box-shadow: inset 0 0 80px rgba(0,0,0,0.25);
      }

      .scan-bg-marble {
        background: 
          radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.1) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 70%, rgba(0,0,0,0.05) 0%, transparent 40%),
          linear-gradient(135deg, #e8e8e8 0%, #d4d4d4 25%, #e0e0e0 50%, #d0d0d0 75%, #e5e5e5 100%);
        box-shadow: inset 0 0 60px rgba(0,0,0,0.08);
      }

      .scan-bg-marble::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.15;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='marbleFilter'%3E%3CfeTurbulence type='turbulence' baseFrequency='0.02' numOctaves='3' result='noise'/%3E%3CfeDisplacementMap in='SourceGraphic' in2='noise' scale='20'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23marbleFilter)' fill='%23999'/%3E%3C/svg%3E");
        pointer-events: none;
        border-radius: 4px;
      }

      .scan-bg-concrete {
        background: 
          linear-gradient(180deg, rgba(0,0,0,0.08) 0%, transparent 40%, rgba(0,0,0,0.1) 100%),
          linear-gradient(135deg, #7a7a7a 0%, #6e6e6e 25%, #757575 50%, #696969 75%, #727272 100%);
        box-shadow: inset 0 0 80px rgba(0,0,0,0.15);
      }

      .scan-bg-concrete::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.5;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='concreteNoise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23concreteNoise)'/%3E%3C/svg%3E");
        pointer-events: none;
        mix-blend-mode: overlay;
        border-radius: 4px;
      }

      .scan-drop-shadow {
        filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4)) drop-shadow(0 2px 6px rgba(0,0,0,0.3));
      }

      .scanner-inner {
        position: relative;
        transform-style: preserve-3d;
        transform: 
          rotateZ(var(--scan-rotation))
          rotateY(var(--scan-perspective-x))
          rotateX(var(--scan-perspective-y));
        transition: transform 0.3s ease-out;
      }

      .scanned-effect {
        position: relative;
        overflow: hidden;
      }

      .scanned-effect > * {
        filter: 
          contrast(var(--scan-contrast)) 
          brightness(var(--scan-brightness)) 
          blur(var(--scan-blur)) 
          sepia(var(--scan-warmth));
      }

      .scan-noise-layer {
        position: absolute;
        inset: -5%;
        width: 110%;
        height: 110%;
        z-index: 10;
        pointer-events: none;
        opacity: var(--scan-noise);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
      }

      .scan-texture-layer {
        position: absolute;
        inset: 0;
        z-index: 11;
        pointer-events: none;
        opacity: var(--scan-texture);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paperFilter'%3E%3CfeTurbulence type='turbulence' baseFrequency='0.04' numOctaves='5' result='noise'/%3E%3CfeDiffuseLighting in='noise' lighting-color='%23fff' surfaceScale='2'%3E%3CfeDistantLight azimuth='45' elevation='60'/%3E%3C/feDiffuseLighting%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23paperFilter)'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .scan-vignette-layer {
        position: absolute;
        inset: 0;
        z-index: 12;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 50%, 
          transparent 40%, 
          rgba(0,0,0, calc(var(--scan-vignette) * 0.3)) 100%
        );
      }

      .scan-light-layer {
        position: absolute;
        inset: 0;
        z-index: 13;
        pointer-events: none;
        background: 
          linear-gradient(
            125deg, 
            rgba(255,255,255, calc(var(--scan-shadow) * 0.5)) 0%, 
            transparent 25%, 
            transparent 75%,
            rgba(0,0,0, calc(var(--scan-shadow) * 0.3)) 100%
          );
      }

      .scan-edge-shadow {
        position: absolute;
        inset: 0;
        z-index: 14;
        pointer-events: none;
        box-shadow: 
          inset 0 0 40px rgba(0,0,0, calc(var(--scan-shadow) * 0.15)),
          inset 2px 0 8px rgba(0,0,0, calc(var(--scan-shadow) * 0.1)),
          inset -2px 0 8px rgba(0,0,0, calc(var(--scan-shadow) * 0.1)),
          inset 0 2px 8px rgba(0,0,0, calc(var(--scan-shadow) * 0.08)),
          inset 0 -2px 8px rgba(0,0,0, calc(var(--scan-shadow) * 0.08));
      }

      .scan-crease-layer {
        position: absolute;
        inset: 0;
        z-index: 15;
        pointer-events: none;
        opacity: calc(var(--scan-texture) * 0.4);
        background: 
          linear-gradient(90deg, transparent 49.5%, rgba(0,0,0,0.03) 49.5%, rgba(0,0,0,0.03) 50.5%, transparent 50.5%),
          linear-gradient(0deg, transparent 49.5%, rgba(0,0,0,0.02) 49.5%, rgba(0,0,0,0.02) 50.5%, transparent 50.5%);
      }

      .scan-dust-layer {
        position: absolute;
        inset: 0;
        z-index: 16;
        pointer-events: none;
        opacity: calc(var(--scan-noise) * 0.3);
        background-image: 
          radial-gradient(circle at 15% 25%, rgba(0,0,0,0.4) 0.5px, transparent 0.5px),
          radial-gradient(circle at 85% 15%, rgba(0,0,0,0.3) 0.8px, transparent 0.8px),
          radial-gradient(circle at 45% 85%, rgba(0,0,0,0.35) 0.6px, transparent 0.6px),
          radial-gradient(circle at 75% 65%, rgba(0,0,0,0.25) 0.4px, transparent 0.4px),
          radial-gradient(circle at 25% 55%, rgba(0,0,0,0.3) 0.5px, transparent 0.5px),
          radial-gradient(circle at 92% 78%, rgba(0,0,0,0.2) 0.7px, transparent 0.7px),
          radial-gradient(circle at 8% 92%, rgba(0,0,0,0.35) 0.3px, transparent 0.3px);
      }

      .scan-scan-lines {
        position: absolute;
        inset: 0;
        z-index: 17;
        pointer-events: none;
        opacity: calc(var(--scan-texture) * 0.15);
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.02) 2px,
          rgba(0,0,0,0.02) 4px
        );
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
